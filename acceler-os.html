<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Acceler OS — Pre-Sales</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230E2A5E'/><rect x='9' y='9' width='6' height='6' fill='%2322D3EE'/></svg>" />
<style>
  /* ════════════════════════════════════════════════════════════════════
     DESIGN TOKENS — Acceler brand (navy + cyan), light-on-eye
     ════════════════════════════════════════════════════════════════════ */
  :root {
    /* brand */
    --navy: #0E2A5E;
    --navy-deep: #081A40;
    --navy-soft: #1E4E9C;
    --navy-day: #1A2B4A;
    --navy-day-alt: #0D1F3C;
    --cyan: #22D3EE;
    --cyan-soft: #67E8F9;
    --cyan-dim: #E0F7FB;

    /* surfaces */
    --bg: #FAFBFC;
    --surface: #FFFFFF;
    --surface-2: #F5F7FA;
    --surface-3: #EEF1F6;

    /* lines */
    --border: #E8EBF1;
    --border-strong: #D1D6E0;

    /* text */
    --text: #14213D;
    --text-muted: #5B6478;
    --text-dim: #8B92A3;

    /* signal */
    --success: #16A34A;
    --warn: #D97706;
    --warn-soft: #FEF3C7;
    --danger: #DC2626;
    --danger-soft: #FEE2E2;
    --info: #2563EB;

    /* shadows */
    --shadow-sm: 0 1px 2px rgba(20,33,61,0.04), 0 0 0 1px rgba(20,33,61,0.04);
    --shadow: 0 2px 8px rgba(20,33,61,0.06), 0 0 0 1px rgba(20,33,61,0.04);
    --shadow-lg: 0 8px 24px rgba(20,33,61,0.08), 0 0 0 1px rgba(20,33,61,0.04);
    --ring: 0 0 0 3px rgba(34,211,238,0.18);

    /* radii */
    --r-sm: 6px;
    --r: 10px;
    --r-lg: 14px;
    --r-xl: 18px;

    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    height: 100vh; overflow: hidden; font-size: 14px; line-height: 1.5;
    letter-spacing: -0.005em;
  }
  body { display: flex; }

  /* ════════════════════════════════════════════════════════════════════
     SIDEBAR
     ════════════════════════════════════════════════════════════════════ */
  .sidebar {
    width: 248px; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .brand {
    padding: 22px 22px 18px; border-bottom: 1px solid var(--border);
  }
  .brand svg { display: block; height: 28px; width: auto; }
  .brand-sub {
    margin-top: 10px; font-size: 10.5px; color: var(--text-dim);
    letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600;
  }

  .nav { padding: 14px 12px; flex: 1; overflow-y: auto; }
  .nav-section {
    font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-dim); padding: 16px 12px 6px; font-weight: 600;
  }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 8px 12px; border-radius: var(--r-sm); margin-bottom: 1px;
    color: var(--text-muted); cursor: pointer; font-size: 13.5px;
    transition: background 0.12s, color 0.12s; user-select: none;
    position: relative; font-weight: 500;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active {
    background: var(--surface-2); color: var(--navy); font-weight: 600;
  }
  .nav-item.active::before {
    content: ""; position: absolute; left: -12px; top: 6px; bottom: 6px;
    width: 3px; background: var(--cyan); border-radius: 0 2px 2px 0;
  }
  .nav-item .icon {
    width: 16px; height: 16px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: currentColor;
  }
  .nav-item .icon svg { width: 16px; height: 16px; }

  .user {
    padding: 14px 18px; border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 999px;
    background: var(--navy); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em;
  }
  .user-info { line-height: 1.3; min-width: 0; flex: 1; }
  .user-info .name { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .user-info .role { font-size: 10.5px; color: var(--text-dim); }

  /* ════════════════════════════════════════════════════════════════════
     MAIN AREA
     ════════════════════════════════════════════════════════════════════ */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .topbar {
    height: 56px; padding: 0 28px; flex-shrink: 0;
    border-bottom: 1px solid var(--border); background: var(--surface);
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h1 {
    font-size: 15px; font-weight: 600; margin: 0;
    letter-spacing: -0.01em; color: var(--text);
  }
  .topbar .crumbs { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .topbar .crumbs strong { color: var(--text); font-weight: 600; }

  .conn { display: inline-flex; align-items: center; gap: 7px;
    font-size: 11.5px; color: var(--text-muted); padding: 5px 10px;
    background: var(--surface-2); border-radius: 999px;
  }
  .conn .ind { width: 6px; height: 6px; border-radius: 50%; background: var(--success);
    box-shadow: 0 0 0 3px rgba(22,163,74,0.12); }

  .content { flex: 1; overflow-y: auto; padding: 32px 36px 64px; }
  .content-narrow { max-width: 1200px; margin: 0 auto; }

  /* ════════════════════════════════════════════════════════════════════
     PRIMITIVES
     ════════════════════════════════════════════════════════════════════ */
  h1, h2, h3, h4 { margin: 0; color: var(--text); letter-spacing: -0.015em; }
  p { margin: 0; }

  .card {
    background: var(--surface); border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm); padding: 22px 24px;
  }
  .card + .card { margin-top: 14px; }
  .card-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--text-muted);
    margin: 0 0 14px; display: flex; align-items: center; gap: 8px;
  }
  .card-title .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--cyan);
    box-shadow: 0 0 0 2px var(--cyan-dim);
  }
  .card-h {
    font-size: 15px; font-weight: 600; color: var(--text);
    margin: 0 0 12px; letter-spacing: -0.01em;
  }

  /* FORMS */
  label {
    display: block; font-size: 11.5px; font-weight: 500; color: var(--text-muted);
    margin: 14px 0 6px; letter-spacing: 0.01em;
  }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%; border: 1px solid var(--border-strong); border-radius: var(--r-sm);
    padding: 9px 12px; font-size: 13px; color: var(--text);
    background: var(--surface); font-family: inherit;
    transition: border-color 0.12s, box-shadow 0.12s; outline: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--cyan); box-shadow: var(--ring);
  }
  textarea {
    min-height: 180px; resize: vertical; line-height: 1.55;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
  }
  select {
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M3 4.5L6 7.5L9 4.5' stroke='%235B6478' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat; background-position: right 10px center;
    padding-right: 32px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  /* BUTTONS */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid transparent; border-radius: var(--r-sm); padding: 8px 14px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.12s;
    font-family: inherit; text-decoration: none; line-height: 1;
    white-space: nowrap;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--navy-deep); }
  .btn-cyan { background: var(--cyan); color: var(--navy); }
  .btn-cyan:hover:not(:disabled) { background: var(--cyan-soft); }
  .btn-secondary {
    background: var(--surface); color: var(--navy); border-color: var(--border-strong);
  }
  .btn-secondary:hover { background: var(--surface-2); border-color: var(--navy); }
  .btn-ghost { background: transparent; color: var(--text-muted); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
  .btn-sm { padding: 6px 11px; font-size: 12px; }
  .btn-lg { padding: 11px 18px; font-size: 14px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

  /* BADGES */
  .badge {
    display: inline-flex; align-items: center; padding: 2px 8px;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em;
    border-radius: 4px; line-height: 1.6;
  }
  .badge-navy   { color: var(--navy); background: rgba(14,42,94,0.08); }
  .badge-cyan   { color: #0891A8; background: var(--cyan-dim); }
  .badge-warn   { color: var(--warn); background: var(--warn-soft); }
  .badge-success{ color: var(--success); background: #DCFCE7; }
  .badge-danger { color: var(--danger); background: var(--danger-soft); }
  .badge-muted  { color: var(--text-muted); background: var(--surface-2); }

  /* GRIDS */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

  hr.sep { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  /* ════════════════════════════════════════════════════════════════════
     DASHBOARD
     ════════════════════════════════════════════════════════════════════ */
  .hero {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
    border-radius: var(--r-xl); padding: 28px 32px; margin-bottom: 24px;
    box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
  }
  .hero::before {
    content: ""; position: absolute; top: -40px; right: -40px;
    width: 200px; height: 200px; border-radius: 999px;
    background: radial-gradient(circle, var(--cyan-dim) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--cyan); font-weight: 700; margin-bottom: 6px; position: relative; }
  .hero h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em;
    margin-bottom: 4px; position: relative; }
  .hero p { color: var(--text-muted); font-size: 13.5px; position: relative; }

  .stat {
    background: var(--surface); border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm); padding: 18px 20px;
    transition: box-shadow 0.15s;
  }
  .stat:hover { box-shadow: var(--shadow); }
  .stat .l { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); font-weight: 600; margin-bottom: 10px; }
  .stat .v { font-size: 24px; font-weight: 700; color: var(--text);
    font-feature-settings: "tnum"; letter-spacing: -0.02em; line-height: 1; }
  .stat .v.muted { color: var(--text-dim); font-size: 16px; font-weight: 600; }
  .stat .s { font-size: 11.5px; color: var(--text-dim); margin-top: 8px; }
  .stat .delta { color: var(--success); }
  .stat .delta.down { color: var(--warn); }

  .quick-tile {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); cursor: pointer; transition: all 0.12s;
    text-decoration: none; color: inherit;
  }
  .quick-tile:hover {
    border-color: var(--navy); transform: translateY(-1px); box-shadow: var(--shadow);
  }
  .quick-tile .qico {
    width: 36px; height: 36px; border-radius: var(--r-sm);
    background: var(--surface-2); color: var(--navy);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .quick-tile .qico svg { width: 18px; height: 18px; }
  .quick-tile .qbody { flex: 1; min-width: 0; }
  .quick-tile .qt { font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }
  .quick-tile .qsub { font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }
  .quick-tile .qarrow { color: var(--text-dim); align-self: center; }

  /* PROPOSAL OUTPUT (matches IK-Acceler samples) */
  .proposal { background: #fff; border-radius: var(--r); overflow: hidden;
    box-shadow: var(--shadow-sm); }
  .ik-cover, .ik-closing {
    background: var(--navy-deep); color: #fff; padding: 48px 36px; text-align: center;
    position: relative; overflow: hidden;
  }
  .ik-cover::before {
    content: ""; position: absolute; top: -120px; right: -120px;
    width: 320px; height: 320px; border-radius: 999px;
    background: radial-gradient(circle, rgba(34,211,238,0.16) 0%, transparent 60%);
  }
  .ik-closing { padding: 56px 36px; }
  .ik-eyebrow { font-size: 10.5px; letter-spacing: 0.2em; margin-bottom: 28px; font-weight: 600; position: relative; }
  .ik-eyebrow .ac { color: var(--cyan); }
  .ik-partnering { font-size: 17px; margin: 0 auto 12px; max-width: 580px; line-height: 1.5; position: relative; }
  .ik-tagline { font-size: 14.5px; color: rgba(255,255,255,0.75); margin-bottom: 28px; position: relative; }
  .ik-proposal-for { font-size: 11.5px; letter-spacing: 0.2em; color: rgba(255,255,255,0.7); margin-bottom: 8px; text-transform: uppercase; font-weight: 600; position: relative; }
  .ik-client { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; position: relative; }
  .ik-date { font-size: 13px; color: rgba(255,255,255,0.7); margin: 0 0 26px; position: relative; }
  .ik-title { font-size: 23px; font-weight: 700; line-height: 1.3; margin: 0 auto 8px; max-width: 700px; position: relative; }
  .ik-subtitle { font-size: 13.5px; color: rgba(255,255,255,0.78); margin: 0 auto; max-width: 640px; line-height: 1.5; position: relative; }
  .ik-closing-title { font-size: 38px; font-weight: 800; letter-spacing: 0.04em; position: relative; }
  .ik-stats { display: grid; grid-template-columns: repeat(4, 1fr); background: #1A2B4A; }
  .ik-stat { padding: 14px 12px; text-align: center; color: #fff;
    border-right: 1px solid rgba(255,255,255,0.08); }
  .ik-stat:last-child { border-right: none; }
  .ik-stat .emoji { font-size: 18px; margin-bottom: 5px; }
  .ik-stat .label { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(255,255,255,0.65); font-weight: 700; margin-bottom: 3px; }
  .ik-stat .value { font-size: 11.5px; font-weight: 600; line-height: 1.3; }
  .proposal-body { padding: 28px 36px 36px; }
  .proposal-body h1 { font-size: 21px; font-weight: 700; color: var(--navy);
    margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--navy); }
  .proposal-body h2 { font-size: 16px; font-weight: 700; color: var(--navy); margin: 22px 0 8px; }
  .proposal-body h3 { font-size: 13.5px; font-weight: 700; color: var(--text); margin: 16px 0 6px; }
  .proposal-body h3.day {
    color: #fff; background: var(--navy-day); padding: 8px 14px;
    font-size: 13px; border-radius: var(--r-sm);
  }
  .proposal-body h3.day.alt { background: var(--navy-day-alt); }
  .proposal-body p { font-size: 13px; line-height: 1.65; margin: 8px 0; }
  .proposal-body ul, .proposal-body ol { font-size: 13px; line-height: 1.6; padding-left: 22px; margin: 8px 0; }
  .proposal-body li { margin: 4px 0; }
  .proposal-body strong { font-weight: 700; }
  .proposal-body em { color: var(--text-muted); font-style: normal; }
  .proposal-body table { width: 100%; border-collapse: collapse; margin: 12px 0;
    font-size: 12px; border-radius: var(--r-sm); overflow: hidden; box-shadow: 0 0 0 1px var(--border); }
  .proposal-body th { background: var(--navy); color: #fff; padding: 9px 12px;
    text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: 0.02em; }
  .proposal-body td { padding: 8px 12px; border-bottom: 1px solid var(--border);
    vertical-align: top; line-height: 1.5; }
  .proposal-body tr:nth-child(even) td { background: var(--surface-2); }
  .proposal-body tr:last-child td { border-bottom: none; }
  .takeaway {
    background: var(--cyan-dim); border-left: 3px solid var(--cyan);
    padding: 12px 14px; margin: 12px 0; border-radius: var(--r-sm);
  }
  .takeaway .title { font-weight: 700; color: var(--navy); font-size: 13px; margin-bottom: 6px; }
  .proposal-body tr.gap td { background: #FEF2EC; }
  .proposal-body tr.gap td:first-child { color: #C0392B; font-weight: 700; }

  /* STRENGTH METER */
  .meter-row { display: flex; align-items: center; gap: 10px; font-size: 12px; padding: 4px 0; }
  .meter-row .lbl { min-width: 140px; color: var(--text); font-weight: 500; }
  .meter-row .bar { flex: 1; height: 6px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
  .meter-row .bar > div { height: 100%; border-radius: 999px; transition: width 0.5s ease; }
  .meter-row .pct { min-width: 42px; text-align: right; font-weight: 600;
    color: var(--text-muted); font-size: 11.5px; font-feature-settings: "tnum"; }

  /* SHARED UTILITIES */
  .spinner { width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--cyan);
    animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { display: flex; align-items: center; gap: 10px;
    color: var(--text-muted); font-size: 13px; padding: 16px 0; }
  .error { background: var(--danger-soft); border: 1px solid #FECACA;
    border-radius: var(--r-sm); padding: 12px 14px; color: #991B1B;
    font-size: 12.5px; line-height: 1.5; }
  .helper { font-size: 12px; color: var(--text-muted); line-height: 1.55; }
  .empty-state { text-align: center; padding: 50px 20px; color: var(--text-dim); }
  .empty-state .ico { width: 48px; height: 48px; margin: 0 auto 14px;
    background: var(--surface-2); color: var(--text-dim);
    border-radius: var(--r); display: flex; align-items: center; justify-content: center; }
  .empty-state .ico svg { width: 22px; height: 22px; }
  .empty-state p { font-size: 13px; margin: 0; line-height: 1.5; max-width: 380px; margin-inline: auto; color: var(--text-muted); }
  .fade-in { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  /* LIST ITEMS */
  .list-item {
    display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); margin-bottom: 8px; cursor: pointer;
    transition: all 0.12s;
  }
  .list-item:hover {
    border-color: var(--navy); transform: translateX(2px); box-shadow: var(--shadow-sm);
  }
  .list-item .ico { width: 32px; height: 32px; border-radius: var(--r-sm);
    background: var(--surface-2); display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; font-size: 16px; }
  .list-item .b { flex: 1; min-width: 0; }
  .list-item .t { font-size: 13.5px; font-weight: 600; color: var(--text); }
  .list-item .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; line-height: 1.4; }
  .list-item .meta { font-size: 11px; color: var(--text-dim); margin-left: auto; align-self: center; }

  /* SPLIT LAYOUT */
  .split { display: grid; grid-template-columns: 400px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <svg viewBox="0 0 220 50" xmlns="http://www.w3.org/2000/svg" aria-label="acceler">
      <!-- Cyan square inside the 'a' -->
      <rect x="13" y="13" width="9" height="9" fill="#22D3EE" rx="0.5"/>

// KG query helpers
function kgClients() { return KG_DATA.clients; }
function kgFindClient(name) {
  if (!name) return null;
  const n = name.toLowerCase().trim();
  return KG_DATA.clients.find(c => c.label.toLowerCase() === n) ||
         KG_DATA.clients.find(c => c.label.toLowerCase().includes(n) || n.includes(c.label.toLowerCase()));
}
function kgSimilarClients(brief) {
  // brief: { industry, programme, geography }
  const want = brief || {};
  const wProg = (want.programme || "").toLowerCase();
  const wInd  = (want.industry  || "").toLowerCase();
  const wGeo  = (want.geography || "").toLowerCase();
  return KG_DATA.clients
    .map(c => {
      let s = 0;
      if (wProg && c.programs.some(p => p.toLowerCase().includes(wProg) || wProg.includes(p.toLowerCase()))) s += 3;
      if (wInd  && c.label.toLowerCase().includes(wInd)) s += 2;
      if (wInd  && c.topics.some(t => t.toLowerCase().includes(wInd) || wInd.includes(t.toLowerCase()))) s += 1;
      if (wGeo  && c.pricing && (
        (wGeo.includes("india") && c.pricing.includes("₹")) ||
        (wGeo.includes("us")    && c.pricing.includes("$") && !c.pricing.includes("₹"))
      )) s += 1;
      s += Math.min(c.file_count, 30) / 30; // weight by corpus size
      return { ...c, score: s };
    })
    .filter(c => c.score > 1)
    .sort((a,b) => b.score - a.score)
    .slice(0, 6);
}
function kgPricingBands(geo, programme) {
  // Return matching clients' pricing bands
  const wProg = (programme || "").toLowerCase();
  const wGeo  = (geo || "").toLowerCase();
  return KG_DATA.clients
    .filter(c => c.pricing)
    .filter(c => !wProg || c.programs.some(p => p.toLowerCase().includes(wProg)))
    .filter(c => {
      if (!wGeo) return true;
      if (wGeo.includes("india")) return c.pricing.includes("₹");
      return c.pricing.includes("$");
    })
    .slice(0, 8);
}
function kgInstructorsForTopic(topic, limit) {
  if (!topic) return [];
  const q = topic.toLowerCase();
  return KG_DATA.instructors
    .map(i => {
      let s = 0;
      i.t.forEach(t => { if (t.toLowerCase().includes(q) || q.includes(t.toLowerCase())) s += 3; });
      (i.e || []).forEach(e => { if (e.toLowerCase().includes(q)) s += 2; });
      if (i.r && i.r.toLowerCase().includes(q)) s += 1;
      return { ...i, score: s };
    })
    .filter(i => i.score > 0)
    .sort((a,b) => b.score - a.score)
    .slice(0, limit || 8);
}

function inlineMd(s) {

  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");

  const closeUl = () => { if (inUl) { html += "</ul>"; inUl = false; } };
  const closeOl = () => { if (inOl) { html += "</ol>"; inOl = false; } };
  const closeQ = () => { if (inQ) { html += "</div>"; inQ = false; } };
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*\|.+\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s\-:|]+\|\s*$/.test(lines[i + 1])) {
      closeUl(); closeOl(); closeQ();
      const headers = line.trim().slice(1, -1).split("|").map(s => s.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.+\|\s*$/.test(lines[i])) {
        rows.push(lines[i].trim().slice(1, -1).split("|").map(s => s.trim()));
        i++;
      }
      html += "<table><thead><tr>" + headers.map(h => `<th>${inlineMd(h)}</th>`).join("") + "</tr></thead><tbody>";
      for (const r of rows) {
        const gap = r[0] && /^⚠/.test(r[0]);
        html += "<tr" + (gap ? ' class="gap"' : "") + ">" + r.map(c => `<td>${inlineMd(c)}</td>`).join("") + "</tr>";
      }
      html += "</tbody></table>";
      continue;
    }
    let m;
    if ((m = line.match(/^###\s+(.*)$/))) {
      closeUl(); closeOl(); closeQ();
      const t = m[1]; const isDay = /^(Day\s|Module\s\d)/i.test(t);
      html += `<h3${isDay ? ' class="day"' : ""}>${inlineMd(t)}</h3>`;
      i++; continue;
    }
    if ((m = line.match(/^##\s+(.*)$/)))  { closeUl(); closeOl(); closeQ(); html += `<h2>${inlineMd(m[1])}</h2>`; i++; continue; }
    if ((m = line.match(/^#\s+(.*)$/)))   { closeUl(); closeOl(); closeQ(); html += `<h1>${inlineMd(m[1])}</h1>`; i++; continue; }
    if (/^---+\s*$/.test(line)) { closeUl(); closeOl(); closeQ(); html += "<hr/>"; i++; continue; }
    if (line.startsWith(">")) {
      if (!inQ) { closeUl(); closeOl(); html += `<div class="takeaway">`; inQ = true; }
      const c = line.replace(/^>\s?/, "");
      if (/^\*\*🎯/.test(c)) html += `<div class="title">${inlineMd(c.replace(/^\*\*|\*\*$/g, ""))}</div>`;
      else if (c.trim() === "") html += "<br/>";
      else if (c.startsWith("-")) html += `<div>• ${inlineMd(c.replace(/^-\s*/, ""))}</div>`;
      else html += `<div>${inlineMd(c)}</div>`;
      i++; continue;
    } else closeQ();
    if ((m = line.match(/^\s*-\s+(.*)$/))) {

}

function parseCoverBlock(md) {
  const m = (md || "").match(/\[COVER\]([\s\S]*?)\[\/COVER\]/);
  if (!m) return null;
  const obj = { stats: [] };
  m[1].split("\n").map(l => l.trim()).filter(Boolean).forEach(line => {
    const idx = line.indexOf(":");
    if (idx === -1) return;
    const k = line.slice(0, idx).trim();
    const v = line.slice(idx + 1).trim();
    if (/^stat_\d+$/.test(k)) {
      const p = v.split("|").map(s => s.trim());
      if (p.length >= 3) obj.stats.push({ emoji: p[0], label: p[1], value: p.slice(2).join(" | ") });
    } else obj[k] = v;
  });
  return obj;
}

function rateUSD(tier, geo) {
  const isIndia = geo === "India";
  if (tier === "faang")   return isIndia ? 150 : 200;
  if (tier === "tier1")   return isIndia ? 35  : 55;
  if (tier === "special") return 400;
  return isIndia ? 55 : 110;
}
function currOf(geo) { return geo === "India" ? "INR" : "USD"; }
function fxToCurr(amountUSD, geo) { return geo === "India" ? amountUSD * 84 : amountUSD; }
function fxFromINR(amountINR, geo) { return geo === "India" ? amountINR : amountINR / 84; }

function pricingFormulas(inp) {
  // inp: { geo, days, hrsday, coaching, batch, assignments, tier, curriculum, vm, overhead, margin, elevate }
  const liveHrs = inp.days * inp.hrsday + inp.coaching;
  const rate = rateUSD(inp.tier, inp.geo);

  // Curriculum (in target currency)
  let curr = 0;
  if (inp.curriculum === "existing") curr = liveHrs * 113;
  else if (inp.curriculum === "new") curr = liveHrs * 263;
  else if (inp.curriculum === "niche") curr = liveHrs * 263 * 1.25;
  curr = fxToCurr(curr, inp.geo);

  // Instructor (per scenario)
  const liveCost = fxToCurr(liveHrs * rate, inp.geo);
  const dryA = fxToCurr(liveHrs * rate, inp.geo);
  const dryB = 0;
  const prepA = fxToCurr(2 * liveHrs * rate, inp.geo);
  const prepB = fxToCurr(1 * liveHrs * rate, inp.geo);

  // TA (INR base → convert if needed)
  const taAssignINR = 500 * inp.assignments * inp.batch;
  const taLiveINR = 1000 * liveHrs;
  const taAssign = fxFromINR(taAssignINR, inp.geo);
  const taLive = fxFromINR(taLiveINR, inp.geo);

  // VM
  const vmINR = inp.vm === "acceler" ? 500 * inp.batch * inp.days : 0;
  const vm = fxFromINR(vmINR, inp.geo);

  // Currying scenario builder
  const build = (prep, dry) => {
    const base = curr + prep + dry + liveCost + taAssign + taLive + vm;
    const overheads = base * (inp.overhead / 100);
    const total = base + overheads;
    const margin = total * (inp.margin / 100);
    const pricing = Math.round((total + margin) / 1000) * 1000; // round to nearest thousand
    return { curriculum: curr, prep, dryRun: dry, live: liveCost, taAssign, taLive, vm, base, overheads, total, margin, pricing };
  };

  const A = build(prepA, dryA);
  const B = build(prepB, dryB);
  // C is the cheapest base (use B's structure) with Elevate discount
  const cBase = { ...B };
  cBase.discount = cBase.pricing * (inp.elevate / 100);
  cBase.pricingFinal = Math.round((cBase.pricing - cBase.discount) / 1000) * 1000;
  // For A & B, no discount applied → pricingFinal = pricing
  A.discount = 0; A.pricingFinal = A.pricing;
  B.discount = 0; B.pricingFinal = B.pricing;

  // Derived
  [A, B, cBase].forEach(s => {
    s.perLearner = s.pricingFinal / inp.batch;
    s.perDay = s.perLearner / inp.days;
  });

  return { A, B, C: cBase, meta: { liveHrs, rate, currency: currOf(inp.geo) } };
}

function fmtMoney(n, geo) {
  if (!isFinite(n)) return "—";
  if (geo === "India") {
    // Indian number system (1,23,456.00)
    const x = Math.round(n);
    const neg = x < 0 ? "-" : "";
    const s = String(Math.abs(x));
    const last3 = s.length > 3 ? s.slice(-3) : s;
    const rest = s.length > 3 ? s.slice(0, -3) : "";
    const restFmt = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ",");
    return "₹" + neg + (rest ? restFmt + "," : "") + last3;
  }
  return "$" + Math.round(n).toLocaleString("en-US");
}
function parseMoney(s) {
  if (!s) return 0;
  const cleaned = String(s).replace(/[₹$,\s]/g, "");
  const v = parseFloat(cleaned);
  return isNaN(v) ? 0 : v;
}

function recomputePricing() {
  const inp = state.pricing.inputs;
  const r = pricingFormulas(inp);
  state.pricing.lastComputed = r;
  $("pr-sheet").innerHTML = renderPricingSheet(r, inp);
  attachPricingHandlers();
  // refresh meta line
  const meta = document.querySelector(".card .helper");
}

function attachPricingHandlers() {
  document.querySelectorAll(".px-edit").forEach(el => {
    el.addEventListener("blur", () => {
      const col = el.dataset.col, row = el.dataset.row;
      const v = parseMoney(el.textContent);
      // If matches formula value, no override
      const computed = state.pricing.lastComputed[col][row];
      if (Math.abs(v - Math.round(computed)) < 1) {
        delete state.pricing.overrides[`${col}-${row}`];
      } else {
        state.pricing.overrides[`${col}-${row}`] = v;
      }
      recomputePricing();
    });
    el.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); el.blur(); }
      if (e.key === "Escape") {
        const computed = state.pricing.lastComputed[el.dataset.col][el.dataset.row];
        el.textContent = fmtMoney(computed, state.pricing.inputs.geo);
        el.blur();
      }
    });
  });
  document.querySelectorAll(".px-clear").forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();
      delete state.pricing.overrides[el.dataset.clear];
      recomputePricing();
    });
  });
}

function pricingToTSV() {
  const inp = state.pricing.inputs;
  const r = state.pricing.lastComputed;
  const ov = state.pricing.overrides;
  const val = (col, key) => ov[`${col}-${key}`] !== undefined ? ov[`${col}-${key}`] : r[col][key];
  const lines = [];
  lines.push(["Acceler Pricing — " + inp.client + " (" + inp.geo + ")"].join("\t"));
  lines.push([`Currency: ${currOf(inp.geo)} · Live hrs: ${r.meta.liveHrs} · Rate: $${r.meta.rate}/hr · FX: ₹84/$`].join("\t"));
  lines.push([""].join("\t"));
  lines.push(["Line item", "A: First Delivery", "B: Repeat", "C: Elevate"].join("\t"));
  PRICING_ROWS.forEach(row => {
    if (row.section) {
      lines.push([row.label, "", "", ""].join("\t"));
      return;
    }
    const a = (row.key === "discount" || row.key === "pricingFinal") ? "—" : fmtMoney(val("A", row.key), inp.geo);
    const b = (row.key === "discount" || row.key === "pricingFinal") ? "—" : fmtMoney(val("B", row.key), inp.geo);
    const c = fmtMoney(val("C", row.key), inp.geo);
    lines.push([row.label, a, b, c].join("\t"));
  });
  return lines.join("\n");
}

function pricingToCSV() {
  return pricingToTSV().replace(/\t/g, ",").replace(/"/g, '""');
}

function renderKGTab(tab, search) {
  const q = (search || "").toLowerCase().trim();
  const matches = (s) => !q || (s && s.toLowerCase().includes(q));

  if (tab === "clients") {
    const list = KG_DATA.clients
      .filter(c => matches(c.label) || c.programs.some(matches) || c.tools.some(matches) || (c.pricing && matches(c.pricing)))
      .sort((a,b) => b.file_count - a.file_count);
    return `<div style="max-height:64vh; overflow-y:auto;">
      <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead style="position:sticky; top:0; background:var(--surface-2); z-index:1;">
          <tr>
            <th style="padding:11px 14px; text-align:left; font-weight:600; font-size:11.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-muted); border-bottom:1px solid var(--border);">Client</th>
            <th style="padding:11px 14px; text-align:left; font-weight:600; font-size:11.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-muted); border-bottom:1px solid var(--border);">Programmes</th>
            <th style="padding:11px 14px; text-align:left; font-weight:600; font-size:11.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-muted); border-bottom:1px solid var(--border);">Tools</th>
            <th style="padding:11px 14px; text-align:right; font-weight:600; font-size:11.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-muted); border-bottom:1px solid var(--border);">Files</th>
            <th style="padding:11px 14px; text-align:left; font-weight:600; font-size:11.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-muted); border-bottom:1px solid var(--border);">Pricing</th>
          </tr>
        </thead>
        <tbody>
          ${list.slice(0, 80).map(c => `
            <tr style="border-bottom:1px solid var(--border);">
              <td style="padding:11px 14px;"><div style="font-weight:600; color:var(--text);">${esc(c.label)}</div></td>
              <td style="padding:11px 14px;">${c.programs.slice(0,3).map(p => `<span class="badge badge-cyan" style="margin-right:4px;">${esc(p)}</span>`).join("")}${c.programs.length > 3 ? `<span style="font-size:11px; color:var(--text-dim);">+${c.programs.length-3}</span>` : ""}</td>

              <td style="padding:11px 14px; text-align:right; font-feature-settings:'tnum'; color:var(--text-muted);">${c.file_count}</td>

            </tr>

      </table>
      ${list.length === 0 ? `<div class="empty-state" style="padding:32px;"><p>No clients match "${esc(q)}"</p></div>` : ""}
    </div>`;
  }

  if (tab === "programs") {
    return `<div style="padding:8px;"><div class="grid-3" style="gap:10px;">
      ${KG_DATA.programs.filter(p => matches(p.label)).map(p => `

  if (tab === "instructors") {
    const list = KG_DATA.instructors
      .filter(i => matches(i.n) || (i.t || []).some(matches) || matches(i.r))
      .slice(0, 100);

              <div style="display:flex; flex-wrap:wrap; gap:4px; margin-top:6px;">${(i.t || []).slice(0,4).map(t => `<span class="badge badge-cyan" style="font-size:9.5px;">${esc(t)}</span>`).join("")}</div>

// ════════════════════════════════════════════════════════════════════════════
// INLINE FORCE GRAPH — self-contained, no CDN, runs in any sandbox
// ════════════════════════════════════════════════════════════════════════════
let _kgSimRAF = null;
function renderInlineForceGraph() {
  const wrap = $("kg-canvas-wrap");
  if (!wrap) return;
  if (_kgSimRAF) { cancelAnimationFrame(_kgSimRAF); _kgSimRAF = null; }

  // ── Build node set: top clients + their topics/tools + top topics/tools ──
  const clients = (KG_DATA.clients || []).slice().sort((a,b) => (b.file_count||0) - (a.file_count||0)).slice(0, 30);
  const topTopics = (KG_DATA.topics || []).slice().sort((a,b) => (b.count||0) - (a.count||0)).slice(0, 18).map(t => t.label);
  const topTools  = (KG_DATA.tools  || []).slice().sort((a,b) => (b.count||0) - (a.count||0)).slice(0, 18).map(t => t.label);
  const topicSet = new Set(topTopics);
  const toolSet  = new Set(topTools);

  const nodes = [];
  const idIdx = new Map();
  function addNode(id, label, type, weight) {
    if (idIdx.has(id)) return idIdx.get(id);
    const n = { id, label, type, weight: weight||1, x: 0, y: 0, vx: 0, vy: 0 };
    nodes.push(n);
    idIdx.set(id, nodes.length - 1);
    return nodes.length - 1;
  }
  topTopics.forEach(l => addNode("topic::"+l, l, "topic", 3));
  topTools.forEach(l => addNode("tool::"+l, l, "tool", 2));
  clients.forEach(c => addNode("client::"+c.label, c.label, "client", Math.max(2, Math.min(8, Math.log2((c.file_count||1)+1)))));

  // ── Edges: client → topic, client → tool (only kept topics/tools) ──
  const edges = [];
  clients.forEach(c => {
    const ci = idIdx.get("client::"+c.label);
    (c.topics||[]).forEach(t => { if (topicSet.has(t)) edges.push([ci, idIdx.get("topic::"+t)]); });
    (c.tools ||[]).forEach(t => { if (toolSet .has(t)) edges.push([ci, idIdx.get("tool::"+t )]); });
  });

  // ── Layout & physics ──
  const W = Math.max(720, wrap.clientWidth || 900);
  const H = 560;
  const cx = W/2, cy = H/2;
  // seed positions in a ring with type bias
  nodes.forEach((n,i) => {
    const a = (i / nodes.length) * Math.PI * 2;
    const r = 200 + (n.type === "client" ? 0 : 80);
    n.x = cx + Math.cos(a) * r;
    n.y = cy + Math.sin(a) * r;
  });

  const COLORS = {
    client: { fill: "#1C4587", stroke: "#3A6FB0", text: "#E8EEF6" },
    topic:  { fill: "#0E7C7B", stroke: "#1FAFAD", text: "#E0F5F5" },
    tool:   { fill: "#7A4E1B", stroke: "#C48C4A", text: "#F5E8D4" },
  };

  // Inject SVG shell + legend
  wrap.innerHTML = `
    <div style="background:#0B1228; border:1px solid var(--border); border-radius:var(--r); padding:6px; position:relative;">
      <div style="position:absolute; top:10px; left:14px; z-index:2; display:flex; gap:14px; font-size:11px; color:#cbd5e1;">
        <span><span style="display:inline-block; width:10px; height:10px; background:${COLORS.client.fill}; border:1px solid ${COLORS.client.stroke}; border-radius:50%; vertical-align:-1px;"></span> Client (${clients.length})</span>
        <span><span style="display:inline-block; width:10px; height:10px; background:${COLORS.topic.fill};  border:1px solid ${COLORS.topic.stroke};  border-radius:50%; vertical-align:-1px;"></span> Topic (${topTopics.length})</span>
        <span><span style="display:inline-block; width:10px; height:10px; background:${COLORS.tool.fill};   border:1px solid ${COLORS.tool.stroke};   border-radius:50%; vertical-align:-1px;"></span> Tool (${topTools.length})</span>
      </div>
      <div id="kg-tip" style="position:absolute; top:10px; right:14px; z-index:2; font-size:11px; color:#94a3b8; pointer-events:none;">Hover a node · ${edges.length} edges</div>
      <svg id="kg-svg" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;">
        <g id="kg-edges" stroke="#2C3F60" stroke-opacity="0.55" stroke-width="0.6"></g>
        <g id="kg-nodes"></g>
        <g id="kg-labels" font-family="Manrope, sans-serif" font-size="10" fill="#cbd5e1" pointer-events="none"></g>
      </svg>
    </div>`;

  const gEdges = wrap.querySelector("#kg-edges");
  const gNodes = wrap.querySelector("#kg-nodes");
  const gLabels= wrap.querySelector("#kg-labels");
  const tip    = wrap.querySelector("#kg-tip");

  // Pre-create SVG elements
  const edgeEls = edges.map(([a,b]) => {
    const ln = document.createElementNS("http://www.w3.org/2000/svg","line");
    gEdges.appendChild(ln);
    return ln;
  });
  const nodeEls = nodes.map((n,i) => {
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    const col = COLORS[n.type];
    const r = n.type === "client" ? Math.max(5, Math.min(14, 3 + n.weight)) : (n.type === "topic" ? 6 : 5);
    c.setAttribute("r", r);
    c.setAttribute("fill", col.fill);
    c.setAttribute("stroke", col.stroke);
    c.setAttribute("stroke-width", "1");
    c.style.cursor = "pointer";
    c.dataset.idx = i;
    c.addEventListener("mouseenter", () => { tip.textContent = `${n.type.toUpperCase()} · ${n.label}`; c.setAttribute("stroke-width","2.5"); });
    c.addEventListener("mouseleave", () => { tip.textContent = `Hover a node · ${edges.length} edges`; c.setAttribute("stroke-width","1"); });
    gNodes.appendChild(c);
    return { el: c, r };
  });
  // Labels only for the larger nodes (clients + topics)
  const labelEls = nodes.map((n,i) => {
    if (n.type === "tool") return null;
    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.textContent = n.label.length > 22 ? n.label.slice(0, 22) + "…" : n.label;
    t.setAttribute("fill", n.type === "client" ? "#E8EEF6" : "#A7D8D7");
    t.setAttribute("font-size", n.type === "client" ? "10.5" : "9.5");
    t.setAttribute("text-anchor", "middle");
    gLabels.appendChild(t);
    return t;
  });

  // ── Physics step ──
  const REPULSE = 1400, SPRING = 0.02, SPRING_LEN = 90, DAMPING = 0.85, CENTER_PULL = 0.0025;
  let alpha = 1, tick = 0;
  function step() {
    // pairwise repulsion (O(N²) — fine for ~70 nodes)
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i+1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx*dx + dy*dy + 0.01;
        if (d2 > 60000) continue;
        const f = REPULSE / d2;
        const d = Math.sqrt(d2);
        const fx = (dx/d) * f, fy = (dy/d) * f;
        a.vx += fx; a.vy += fy;
        b.vx -= fx; b.vy -= fy;
      }
    }
    // spring attraction along edges
    for (const [ai, bi] of edges) {
      const a = nodes[ai], b = nodes[bi];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx*dx + dy*dy) + 0.01;
      const f = (d - SPRING_LEN) * SPRING;
      const fx = (dx/d) * f, fy = (dy/d) * f;
      a.vx += fx; a.vy += fy;
      b.vx -= fx; b.vy -= fy;
    }
    // center pull + damping + integrate
    for (const n of nodes) {
      n.vx += (cx - n.x) * CENTER_PULL;
      n.vy += (cy - n.y) * CENTER_PULL;
      n.vx *= DAMPING; n.vy *= DAMPING;
      n.x += n.vx * alpha; n.y += n.vy * alpha;
      // bounds
      n.x = Math.max(20, Math.min(W-20, n.x));
      n.y = Math.max(20, Math.min(H-20, n.y));
    }
    // render
    for (let k = 0; k < edges.length; k++) {
      const [ai, bi] = edges[k];
      const a = nodes[ai], b = nodes[bi];
      const ln = edgeEls[k];
      ln.setAttribute("x1", a.x.toFixed(1)); ln.setAttribute("y1", a.y.toFixed(1));
      ln.setAttribute("x2", b.x.toFixed(1)); ln.setAttribute("y2", b.y.toFixed(1));
    }
    for (let k = 0; k < nodes.length; k++) {
      const n = nodes[k];
      nodeEls[k].el.setAttribute("cx", n.x.toFixed(1));
      nodeEls[k].el.setAttribute("cy", n.y.toFixed(1));
      const lbl = labelEls[k];
      if (lbl) { lbl.setAttribute("x", n.x.toFixed(1)); lbl.setAttribute("y", (n.y + nodeEls[k].r + 11).toFixed(1)); }
    }
    tick++;
    alpha = Math.max(0.05, alpha * 0.985);
    if (tick < 600) _kgSimRAF = requestAnimationFrame(step);
    else _kgSimRAF = null;
  }
  step();
}

function attachHandlers() {

  document.querySelectorAll("[data-kgtab]").forEach(el => el.addEventListener("click", () => {
    state.knowledge.activeTab = el.dataset.kgtab;
    render();
  }));
  const kgRender = $("kg-render");
  if (kgRender) kgRender.addEventListener("click", () => {
    renderInlineForceGraph();
    kgRender.disabled = true;
    kgRender.textContent = "Rendered ✓";
  });
  const kgLive = $("kg-live");
  if (kgLive) kgLive.addEventListener("click", () => {
    const wrap = $("kg-canvas-wrap");
    if (!wrap) return;
    wrap.innerHTML = `
      <div style="background:#0B1228; border:1px solid var(--border); border-radius:var(--r); padding:6px; position:relative;">
        <div style="position:absolute; top:10px; right:14px; z-index:2; font-size:11px; color:#94a3b8;">
          Live · <a href="https://acceler-knowledge-graph.vercel.app/" target="_blank" rel="noopener" style="color:var(--cyan);">open in new tab ↗</a>
        </div>
        <iframe src="https://acceler-knowledge-graph.vercel.app/"
                style="width:100%; height:78vh; border:0; border-radius:calc(var(--r) - 4px); background:#0B1228;"
                loading="lazy"
                referrerpolicy="no-referrer"
                allow="fullscreen">
        </iframe>
      </div>
      <div style="margin-top:8px; font-size:11px; color:var(--text-dim); text-align:center;">If the frame stays blank, your sandbox is blocking the iframe — use "Open in new tab" instead.</div>`;
    kgLive.disabled = true;
    kgLive.textContent = "Embedded ✓";
  });
  const kgSearch = $("kg-search");
  if (kgSearch) {
    kgSearch.addEventListener("input", () => {
      state.knowledge.search = kgSearch.value;
      // partial re-render of just the card content
      const card = kgSearch.closest(".fade-in")?.querySelector(".card[style*='padding:0']");
      if (card) card.innerHTML = renderKGTab(state.knowledge.activeTab || "clients", state.knowledge.search);
    });
    kgSearch.focus();
    kgSearch.setSelectionRange(kgSearch.value.length, kgSearch.value.length);
  }

  // PROPOSAL
  if ($("p-notes")) {
    $("p-notes").addEventListener("input", () => { state.brief.notes = $("p-notes").value; saveBrief(); });
    ["p-client","p-category","p-geography","p-delivery","p-cohort","p-audience"].forEach(id => {
      const el = $(id);
      if (el) el.addEventListener("input", () => {
        if (id === "p-client") state.brief.client = el.value;
        else state.brief.setup[id.replace("p-","")] = el.value;
        saveBrief(); updateCrumbs();
      });
    });
    $("p-generate") && $("p-generate").addEventListener("click", proposalGenerate);
    $("p-clear")    && $("p-clear").addEventListener("click", () => {
      if (!confirm("Clear all proposal data?")) return;
      state.brief = { client: "", notes: "", setup: { category: "auto", geography: "auto", delivery: "auto", cohort: "", audience: "" }, strength: null, strengthPct: null, overviewMd: "", proposalMd: "", proposalTitle: "" };
      saveBrief(); render();
    });
    $("p-strength") && $("p-strength").addEventListener("click", proposalStrength);
  }

  // PRICING — live spreadsheet, recompute on any input change
  ["pr-client","pr-geo","pr-prog","pr-days","pr-hrsday","pr-coaching","pr-batch","pr-assignments","pr-tier","pr-curriculum","pr-vm","pr-overhead","pr-margin","pr-elevate"].forEach(id => {
    const el = $(id);
    if (!el) return;
    el.addEventListener("input", () => {
      const inp = state.pricing.inputs;
      if (id === "pr-client" || id === "pr-geo" || id === "pr-prog" || id === "pr-tier" || id === "pr-curriculum" || id === "pr-vm") {
        inp[id.replace("pr-","")] = el.value;
      } else if (id === "pr-elevate") {
        inp.elevate = parseFloat(el.value) || 0;
      } else {
        inp[id.replace("pr-","")] = parseFloat(el.value) || 0;

      // Re-render full pricing view so inputs reflect (and header meta updates)
      render();
    });
  });
  if ($("pr-go")) $("pr-go").addEventListener("click", () => {
    state.pricing.calculated = true;
    render();
  });
  if ($("pr-edit-mode")) $("pr-edit-mode").addEventListener("click", () => {
    state.pricing.calculated = false;
    render();
  });
  if ($("pr-reset")) $("pr-reset").addEventListener("click", () => {
    state.pricing.overrides = {};
    render();
  });
  if ($("pr-copy")) $("pr-copy").addEventListener("click", () => {

  if ($("pr-csv")) $("pr-csv").addEventListener("click", () => {

    const name = (state.pricing.inputs.client || "Acceler_Pricing").replace(/[^a-zA-Z0-9]+/g, "_");

  });
  if ($("pr-sheets")) $("pr-sheets").addEventListener("click", () => {
    const tsv = pricingToTSV();
    navigator.clipboard.writeText(tsv).then(() => {
      showToast("Copied — opening Google Sheets · paste with Cmd+V");
      setTimeout(() => window.open("https://sheets.new", "_blank", "noopener"), 250);
    }).catch(() => {
      // Fallback if clipboard fails
      window.open("https://sheets.new", "_blank", "noopener");
      showToast("Sheets opened. Copy/paste manually if clipboard was blocked.");
    });
  });
  // attach cell-edit handlers (re-attached after each render via attachPricingHandlers)
  if (document.querySelector(".px-table")) attachPricingHandlers();

  // MAPPING
  if ($("m-go")) {
    $("m-go").addEventListener("click", mappingBuild);
    $("m-clear").addEventListener("click", () => { state.mapping = { rfp: "", lastResult: "" }; render(); });
    $("m-rfp").addEventListener("input", () => { state.mapping.rfp = $("m-rfp").value; });
  }

  // INSTRUCTORS — KG-driven
  const iGo = $("i-go");
  if (iGo) iGo.addEventListener("click", () => {
    const d = $("i-domain").value.trim();
    if (!d) { showToast("Type a domain first"); return; }
    state.instructors.lastDomain = d;
    render();
  });
  const iDeep = $("i-deep");
  if (iDeep) iDeep.addEventListener("click", smeFind);
  document.querySelectorAll("[data-topic]").forEach(el => el.addEventListener("click", () => {
    state.instructors.lastDomain = el.dataset.topic;
    if ($("i-domain")) $("i-domain").value = el.dataset.topic;
    render();
  }));
  const iGoKg = $("i-go-kg");
  if (iGoKg) iGoKg.addEventListener("click", (e) => {
    e.preventDefault(); e.stopPropagation();
    state.knowledge.activeTab = "graph";
    navigate("knowledge");
  });

  // DECK
  $("d-go") && $("d-go").addEventListener("click", deckGenerate);
  $("d-pptx") && $("d-pptx").addEventListener("click", showPptxModal);
}

// ════════════════════════════════════════════════════════════════════════════
// AGENT ACTIONS
// ════════════════════════════════════════════════════════════════════════════
async function proposalStrength() {
  const b = state.brief;
  const notes = $("p-notes").value.trim();
  if (!notes) { $("p-strength-out").innerHTML = `<div class="error">Paste notes first.</div>`; return; }
  $("p-strength-out").innerHTML = `<div class="loading"><div class="spinner"></div>Scoring brief against 33 discovery questions…</div>`;
  $("p-strength").disabled = true;
  const questions = DISCOVERY.map((s, si) =>
    `## ${s.name}\n` + s.qs.map((q, qi) => `- s${si+1}q${qi+1} [${q.p}] ${q.q}`).join("\n")
  ).join("\n\n");
  const prompt = `Score this pre-sales brief against the Acceler Discovery Checklist. For each question return "yes" / "partial" / "no". Return ONLY valid JSON (no prose, no fence): { "sections": [{ "name": "Why They're Here", "answers": { "s1q1": "yes", ... } }, ...], "summary": "1-2 sentence summary" }. Sections in order: "Why They're Here", "Who's in the Room", "When & How", "Tools & Access", "What They Want Built", "Money & Timeline".\n\nCHECKLIST:\n${questions}\n\nMEETING NOTES:\n---\n${notes}\n---\n\nReturn only the JSON.`;
  try {
    let raw = await ask(prompt);
    raw = raw.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "");
    const m = raw.match(/\{[\s\S]*\}/);
    const parsed = JSON.parse(m ? m[0] : raw);
    b.strength = parsed; b.strengthPct = strengthPct(parsed);
    saveBrief();
    $("p-strength-out").innerHTML = renderStrengthCompact(parsed);
  } catch (e) {
    $("p-strength-out").innerHTML = `<div class="error">${esc(String(e.message || e))}</div>`;
  } finally { $("p-strength").disabled = false; }
}

async function proposalGenerate() {
  const b = state.brief;
  b.notes = $("p-notes").value.trim();
  b.client = $("p-client").value.trim();
  ["category","geography","delivery","cohort","audience"].forEach(k => b.setup[k] = $(`p-${k}`).value);
  saveBrief();
  if (!b.notes) { $("p-output").innerHTML = `<div style="padding:18px;"><div class="error">Paste notes first.</div></div>`; return; }
  const pct = b.strengthPct;
  if (pct === null || pct < 80) return proposalOverview();
  return proposalFull();
}

async function proposalOverview() {
  const b = state.brief;
  const pct = b.strengthPct;
  $("p-output").innerHTML = `<div style="padding:18px 24px;"><div class="loading"><div class="spinner"></div>Drafting overview ${pct !== null ? `(brief is ${pct}% complete)` : ""}…</div></div>`;
  $("p-generate").disabled = true;
  const gaps = strengthGaps(b.strength);
  const prompt = `${SP_OVERVIEW}\n\n────────────────────────────────────────\nSETUP\n────────────────────────────────────────\nClient: ${b.client || "(not specified)"}\nProgramme: ${b.setup.category}\nGeography: ${b.setup.geography}\nDelivery: ${b.setup.delivery}\nCohort: ${b.setup.cohort || "(not specified)"}\nAudience: ${b.setup.audience || "(not specified)"}\n\n${b.strength ? `STRENGTH: ${pct}% — ${b.strength.summary || ""}\nCritical gaps: ${gaps.length ? gaps.map(g => g.q).join("; ") : "(none)"}` : "STRENGTH: not analyzed"}\n\n────────────────────────────────────────\nMEETING NOTES\n────────────────────────────────────────\n${b.notes}\n\nProduce the overview now. Start with H1.`;
  try {
    const raw = await ask(prompt);
    b.overviewMd = raw; saveBrief();
    $("p-output").innerHTML = `
      <div style="padding:18px 24px;">
        <div style="background:var(--warn-soft); border-radius:var(--r-sm); padding:12px 14px; margin-bottom:14px; color:#92400E; font-size:12.5px;">
          <strong>📋 Review the proposal shape.</strong> ${pct !== null ? `Brief was <strong>${pct}%</strong> complete — Mini-UT inferred gaps from UT context.` : "Brief strength not analyzed."} Approve to write the full draft, regenerate to try a different shape, or edit to tweak assumptions.
        </div>
        <div id="ov-view" class="proposal-body" style="padding:18px 22px; border:1px solid var(--border); border-radius:var(--r);">${mdToHtml(raw)}</div>
        <textarea id="ov-edit" style="display:none; margin-top:0; min-height:380px;">${esc(raw)}</textarea>
        <div id="ov-actions" style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
          <button class="btn btn-primary" id="ov-approve">${ICONS.check} Approve & Generate Full Proposal</button>
          <button class="btn btn-secondary" id="ov-edit-btn">${ICONS.edit} Edit</button>
          <button class="btn btn-secondary" id="ov-regen">${ICONS.refresh} Regenerate</button>
        </div>
        <div id="ov-edit-actions" style="display:none; gap:8px; margin-top:12px;">
          <button class="btn btn-primary" id="ov-save">${ICONS.check} Done Editing</button>
          <button class="btn btn-ghost" id="ov-cancel">Cancel</button>
        </div>
      </div>
    `;
    $("ov-approve").addEventListener("click", proposalFull);
    $("ov-regen").addEventListener("click", proposalOverview);
    $("ov-edit-btn").addEventListener("click", () => {
      $("ov-view").style.display = "none"; $("ov-edit").style.display = "block";
      $("ov-actions").style.display = "none"; $("ov-edit-actions").style.display = "flex";
    });
    $("ov-save").addEventListener("click", () => {
      const v = $("ov-edit").value.trim();
      if (v) { state.brief.overviewMd = v; saveBrief(); $("ov-view").innerHTML = mdToHtml(v); }
      $("ov-view").style.display = "block"; $("ov-edit").style.display = "none";
      $("ov-actions").style.display = "flex"; $("ov-edit-actions").style.display = "none";
    });
    $("ov-cancel").addEventListener("click", () => {
      $("ov-view").style.display = "block"; $("ov-edit").style.display = "none";
      $("ov-actions").style.display = "flex"; $("ov-edit-actions").style.display = "none";
    });
  } catch (e) {
    $("p-output").innerHTML = `<div style="padding:18px;"><div class="error">${esc(String(e.message || e))}</div></div>`;
  } finally { $("p-generate").disabled = false; }
}

async function proposalFull() {
  const b = state.brief;
  $("p-output").innerHTML = `<div style="padding:18px 24px;"><div class="loading"><div class="spinner"></div>Drafting full proposal in Acceler house style…</div></div>`;
  $("p-generate") && ($("p-generate").disabled = true);
  const pct = b.strengthPct; const gaps = strengthGaps(b.strength);
  const prompt = `${SP_PROPOSAL}\n\n────────────────────────────────────────\nPROPOSAL SETUP\n────────────────────────────────────────\nClient: ${b.client || "(not specified)"}\nProgramme: ${b.setup.category}\nGeography: ${b.setup.geography}   ← drives sign-off routing\nDelivery: ${b.setup.delivery}\nCohort: ${b.setup.cohort || "(unspecified)"}\nAudience: ${b.setup.audience || "(unspecified)"}\n\n${b.overviewMd ? `────────────────────────────────────────\nAPPROVED OVERVIEW (user reviewed & possibly edited — binding)\n────────────────────────────────────────\n${b.overviewMd}\n\n⚠ Honour the approved shape. If edits contradict notes, edits WIN.\n\n` : ""}${b.strength ? `STRENGTH: ${pct}% — ${b.strength.summary || ""}\nCritical gaps (fill from UT context, flag under Open Questions): ${gaps.length ? gaps.map(g => `[${g.section}] ${g.q}`).join("; ") : "(none)"}\n` : ""}\n────────────────────────────────────────\nMEETING NOTES\n────────────────────────────────────────\n${b.notes}\n\nNow generate the proposal. Start with [COVER]. No preamble.`;
  try {
    const raw = await ask(prompt);
    b.proposalMd = raw; saveBrief();
    $("p-output").innerHTML = renderProposal(raw);
    $("p-actions").innerHTML = `<div style="display:flex; gap:6px; flex-wrap:wrap;">
      <button class="btn btn-cyan btn-sm" onclick="handoffToPricing()">${ICONS.spark} Compute pricing</button>
      <button class="btn btn-cyan btn-sm" onclick="handoffToInstructors()">${ICONS.spark} Find instructors</button>
      <button class="btn btn-secondary btn-sm" onclick="downloadHTML()">${ICONS.download} HTML</button>
      <button class="btn btn-secondary btn-sm" onclick="downloadMD()">${ICONS.download} MD</button>
      <button class="btn btn-ghost btn-sm" onclick="proposalGenerate()">${ICONS.refresh} Regenerate</button>
    </div>`;
  } catch (e) {
    $("p-output").innerHTML = `<div style="padding:18px;"><div class="error">${esc(String(e.message || e))}</div></div>`;
  } finally { $("p-generate") && ($("p-generate").disabled = false); }
}

async function mappingBuild() {
  const rfp = $("m-rfp").value.trim();
  const client = $("m-client").value.trim() || "Client";
  const prog = $("m-prog").value;
  if (!rfp) { $("m-output").innerHTML = `<div class="error">Paste a requirement list first.</div>`; return; }
  state.mapping.rfp = rfp;
  $("m-output").innerHTML = `<div class="loading"><div class="spinner"></div>Building coverage matrix…</div>`;
  $("m-go").disabled = true;
  const prompt = `${SP_MAPPING}\n\nCLIENT: ${client}\nPROGRAMME: ${prog}\n\nCLIENT REQUIREMENTS (verbatim):\n${rfp}\n\nProduce the matrix. Header: "${client} Requirement | Acceler ${prog} — Mapping | Module Topics". End with Coverage Summary.`;

    state.mapping.lastResult = await ask(prompt);
    render(); navigate("mapping");
  } catch (e) {
    $("m-output").innerHTML = `<div class="error">${esc(String(e.message || e))}</div>`;

  } finally { $("i-go") && ($("i-go").disabled = false); }
}

async function deckGenerate() {
  const b = state.brief;
  const client = $("d-client").value.trim() || b.client || "Client";
  const day = $("d-day").value;
  const source = $("d-source").value;
  const manual = $("d-content").value.trim();
  const content = source === "proposal" ? b.proposalMd : manual;
  if (!content) { $("d-output").innerHTML = `<div class="error">No source. Generate a proposal first, or paste an outline.</div>`; return; }
  $("d-output").innerHTML = `<div class="loading"><div class="spinner"></div>Generating deck slides…</div>`;
  $("d-go").disabled = true;
  const prompt = `${SP_DECK}\n\nCLIENT: ${client}\nTARGET: ${day === "all" ? "All days" : `Day ${day}`}\n\nSOURCE:\n${content}\n\nReturn only the HTML (no markdown).`;
  try {
    let raw = await ask(prompt);
    raw = raw.replace(/^```html\s*/i, "").replace(/```\s*$/, "");
    state.deck.lastResult = raw;
    $("d-output").innerHTML = `<style>
      .slide { aspect-ratio: 16/9; background:#fff; border:1px solid var(--border); border-radius:var(--r); padding:24px; margin-bottom:14px; position:relative; overflow:hidden; box-shadow:var(--shadow-sm); }
      .slide h1 { font-size:18px; color:#0E2A5E; margin:0 0 14px; }
      .slide h1 .orange { color:#F86B3C; }
      .objective-bar { background:#6167FA; color:#fff; font-weight:700; padding:8px 12px; border-radius:4px; font-size:11px; margin-bottom:12px; }
      .slide .cards { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
      .slide .card { background:#fff; border:1px solid #ddd; border-radius:4px; padding:0; overflow:hidden; box-shadow:none; }
      .slide .card-header { background:#201845; color:#fff; padding:6px 10px; font-weight:700; font-size:11px; }
      .slide .card-body { padding:8px 10px; font-size:10px; color:#333; line-height:1.5; }
      .slide .label { color:#F86B3C; font-weight:700; }
      .slide .footer { position:absolute; bottom:10px; right:20px; left:20px; display:flex; justify-content:space-between; align-items:center; font-size:9px; color:#595959; }
      .slide .logo { color:#0E2A5E; font-weight:700; letter-spacing:-0.03em; }
      .day-tag { position:absolute; top:14px; left:14px; background:linear-gradient(90deg,#F86B3C,#FF6FA0); color:#fff; padding:4px 10px; border-radius:999px; font-size:10px; font-weight:700; }
    </style>${raw}`;
  } catch (e) {
    $("d-output").innerHTML = `<div class="error">${esc(String(e.message || e))}</div>`;
  } finally { $("d-go") && ($("d-go").disabled = false); }
}

// ════════════════════════════════════════════════════════════════════════════
function buildStyledProposalHtml() {
  const inner = renderProposal(state.brief.proposalMd);
  const styles = `body{font-family:"Manrope","Inter",Arial,sans-serif;color:#14213D;margin:0;padding:0;-webkit-print-color-adjust:exact;}.proposal{max-width:850px;margin:0 auto;}.ik-cover,.ik-closing{background:#081A40;color:#fff;padding:60px 40px;text-align:center;page-break-after:always;}.ik-closing{page-break-after:auto;page-break-before:always;}.ik-eyebrow{font-size:11px;letter-spacing:.2em;margin-bottom:30px;font-weight:600;}.ik-eyebrow .ac{color:#22D3EE;}.ik-partnering{font-size:18px;margin:0 auto 14px;max-width:580px;line-height:1.5;}.ik-tagline{font-size:16px;color:rgba(255,255,255,.78);margin-bottom:34px;}.ik-proposal-for{font-size:13px;letter-spacing:.2em;color:rgba(255,255,255,.7);margin-bottom:10px;text-transform:uppercase;font-weight:600;}.ik-client{font-size:26px;font-weight:700;margin:0 0 6px;}.ik-date{font-size:14px;color:rgba(255,255,255,.7);margin:0 0 32px;}.ik-title{font-size:26px;font-weight:700;line-height:1.3;margin:0 auto 10px;max-width:700px;}.ik-subtitle{font-size:14px;color:rgba(255,255,255,.78);margin:0 auto;max-width:640px;line-height:1.5;}.ik-closing-title{font-size:42px;font-weight:800;letter-spacing:.05em;}.ik-stats{display:table;width:100%;margin:0 0 26px;}.ik-stat{display:table-cell;background:#1A2B4A;color:#fff;padding:16px 14px;text-align:center;width:25%;border-right:1px solid rgba(255,255,255,.08);}.ik-stat:last-child{border-right:none;}.ik-stat .emoji{font-size:22px;margin-bottom:6px;}.ik-stat .label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:700;margin-bottom:4px;}.ik-stat .value{font-size:12px;font-weight:600;}.proposal-body{padding:32px 48px;}.proposal-body h1{font-size:22px;font-weight:700;color:#0E2A5E;margin:30px 0 12px;padding-bottom:6px;border-bottom:2px solid #0E2A5E;}.proposal-body h2{font-size:17px;font-weight:700;color:#0E2A5E;margin:24px 0 10px;}.proposal-body h3{font-size:14px;font-weight:700;color:#14213D;margin:18px 0 8px;}.proposal-body h3.day{color:#fff;background:#1A2B4A;padding:9px 16px;}.proposal-body p{font-size:13.5px;line-height:1.65;margin:9px 0;}.proposal-body ul,.proposal-body ol{font-size:13.5px;line-height:1.6;padding-left:22px;margin:10px 0;}.proposal-body li{margin:4px 0;}.proposal-body table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12.5px;}.proposal-body th{background:#0E2A5E;color:#fff;padding:10px 12px;text-align:left;font-weight:600;}.proposal-body td{padding:9px 12px;border-bottom:1px solid #E8EBF1;vertical-align:top;line-height:1.5;}.proposal-body tr:nth-child(even) td{background:#F5F7FA;}.takeaway{background:#E0F7FB;border-left:4px solid #22D3EE;padding:14px 18px;margin:16px 0;}.takeaway .title{font-weight:700;color:#0E2A5E;font-size:13px;margin-bottom:6px;}@page{margin:.5in;}`;
  return `<!doctype html><html><head><meta charset="utf-8"/><title>${esc(state.brief.proposalTitle || "Acceler Proposal")}</title><style>${styles}</style></head><body>${inner}</body></html>`;
}
function saveBlob(content, mime, filename) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function safeName() {
  return ((state.brief.proposalTitle || state.brief.client || "Acceler_Proposal").replace(/[^a-zA-Z0-9]+/g, "_")).replace(/^_+|_+$/g, "");
}
window.downloadHTML = () => saveBlob(buildStyledProposalHtml(), "text/html;charset=utf-8", `${safeName()}_v0.1.html`);
window.downloadMD   = () => saveBlob(state.brief.proposalMd, "text/markdown;charset=utf-8", `${safeName()}_v0.1.md`);
window.proposalGenerate = proposalGenerate;

// Proposal → Pricing / Instructors handoff. Pre-fills the destination tab with brief context.
window.handoffToPricing = function() {
  const b = state.brief;
  if (!state.pricing.inputs) state.pricing.inputs = { client: "", geo: "India", prog: "AI Builders", days: 2, hrsday: 9, coaching: 0, batch: 20, assignments: 2, tier: "standard", curriculum: "internal", vm: "client", overhead: 100, margin: 40, elevate: 0 };
  const inp = state.pricing.inputs;
  if (b.client) inp.client = b.client;
  if (b.setup.geography && b.setup.geography !== "auto") {
    const g = b.setup.geography.toLowerCase();
    inp.geo = g.includes("india") ? "India" : g.includes("us") ? "US" : g.includes("middle") ? "ME" : g.includes("europe") ? "EU" : "APAC";
  }
  if (b.setup.category && b.setup.category !== "auto") {
    inp.prog = b.setup.category.startsWith("Custom") ? "Custom" : b.setup.category;
  }
  // Infer days/hrs from delivery descriptor like "Fully Live — 4 days (24 hrs)"
  if (b.setup.delivery && b.setup.delivery !== "auto") {
    const d = b.setup.delivery;
    const m = d.match(/(\d+)\s*days?\s*\((\d+)\s*hrs?\)/i);
    if (m) {
      inp.days = parseInt(m[1]);
      inp.hrsday = Math.round(parseInt(m[2]) / inp.days);
    }
  }
  if (b.setup.cohort) {
    const c = parseInt(b.setup.cohort.match(/\d+/)?.[0] || "0");
    if (c) inp.batch = c;
  }
  state.pricing.calculated = false; // start in fill-mode so they see the new defaults
  state.pricing.overrides = {};
  navigate("pricing");
};

window.handoffToInstructors = function() {
  const b = state.brief;
  // Pull the strongest topic signal we have — audience, then category
  const q = (b.setup.audience || "").trim() || (b.setup.category !== "auto" ? b.setup.category : "");
  if (q) {
    state.instructors.lastDomain = q;
  }
  navigate("instructors");
};

})();
